# ==============================================================================
# telegraf.conf — Factory IoT Pipeline
# Version: 3.0
# Matches Node-RED function v3.0
#
# Changes from v2.1:
#
#  [TOML-01 FIXED]  All *_unit constant tags removed from every input block
#                   (rpm_unit, temp_unit, vib_unit, brg_temp_unit, lub_unit,
#                   downtime_unit, kwh_unit, kw_unit, kwh_per_kg_unit,
#                   weight_unit, cycle_time_unit, oee_unit) — 10 constants
#                   were polluting series cardinality for zero query value
#  [TOML-02 FIXED]  machine_status kept as tag; boolean fields (is_running,
#                   is_faulted, is_idle, is_changeover) added from Node-RED
#                   for arithmetic Flux queries without GROUP BY tag
#  [TOML-03 FIXED]  omit_hostname = true — host tag genuinely suppressed now;
#                   location identity comes from plant + tenant + line_id tags
#                   (set per-plant hostname in your plant-specific deployments)
#  [TOML-04 FIXED]  [[processors.converter]] added: shift_start_epoch and
#                   shift_number forced to integer; alarm_active to boolean
#  [TOML-05 FIXED]  qos = 1 on all MQTT inputs; stable client_id per input;
#                   persistent_session = true for reconnect safety
#  [TOML-06 FIXED]  [[processors.dedup]] added for static fields;
#                   [[processors.override]] scoped with namepass filter
#
#  [NEW]  rated_kw field flows through energy measurement (for load-factor Flux)
#  [NEW]  prefault_active field flows through condition measurement (AI Agent flag)
#  [NEW]  changeover_loss_pct field in production (ISO 22400 planned-loss tracking)
#  [NEW]  is_running / is_faulted / is_idle / is_changeover boolean fields in
#         telemetry — enables mean(is_faulted) = fault_rate in Flux without JOIN
#
# DEPLOYMENT NOTE:
#   Run one Telegraf instance per plant (or per gateway edge device).
#   Set the hostname in [agent] to match the plant's gateway:
#     Quarry_Alpha   → gateway-quarry-alpha-01
#     Mill_Beta      → gateway-mill-beta-01
#     Polymer_Site_01 → gateway-polymer-01-01
#     Polymer_Site_02 → gateway-polymer-02-01
#   The host tag is suppressed (omit_hostname = true) so identity comes from
#   plant + tenant tags injected by Node-RED payload, not from the OS hostname.
#
# FREQUENCY RATIONALE (see bottom of file for full discussion):
#   Node-RED Inject node : 60 seconds
#   telegraf interval    : 60s
#   telegraf flush       : 60s
#   InfluxDB write batch : up to 5000 points
# ==============================================================================

[agent]
  interval             = "60s"    # matches Node-RED inject interval
  round_interval       = true
  metric_batch_size    = 5000
  metric_buffer_limit  = 50000
  collection_jitter    = "2s"     # small jitter avoids thundering-herd on exact :00
  flush_interval       = "60s"
  flush_jitter         = "5s"     # small flush jitter smooths InfluxDB write load
  precision            = "1ms"     # millisecond precision — nanosecond is overkill for 60s data
  omit_hostname        = true     # [TOML-03 FIXED] host tag suppressed; location = plant tag
  quiet                = false

# ------------------------------------------------------------------------------
# OUTPUT: InfluxDB v2 / InfluxDB 3 Cloud
# ------------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls             = ["https://us-east-1-1.aws.cloud2.influxdata.com"]
  token            = "${INFLUX_TOKEN1}"
  organization     = "${INFLUX_ORG}"
  bucket           = "${INFLUX_BUCKET1}"
  timeout          = "30s"
  content_encoding = "gzip"


# ------------------------------------------------------------------------------
# PROCESSOR 1 — Inject static line_id tag on all measurements
#   Scoped with namepass to prevent accidental injection on future measurements
#   [TOML-06 FIXED] namepass guard added
# ------------------------------------------------------------------------------
[[processors.override]]
  namepass = ["machine_telemetry", "production_metrics", "energy_metrics", "condition_metrics"]
  [processors.override.tags]
    line_id = "L1"
    # When Plant L2 is commissioned:
    #   1. Remove this block
    #   2. Add line_id to each Node-RED payload per machine's line assignment
    #   3. Telegraf will carry it through as a tag automatically

# ------------------------------------------------------------------------------
# PROCESSOR 2 — Type conversions
#   [TOML-04 FIXED] shift_start_epoch and shift_number → integer
#   alarm_active → boolean; boolean fields from Node-RED → boolean
# ------------------------------------------------------------------------------
[[processors.converter]]
  namepass = ["machine_telemetry", "production_metrics", "energy_metrics", "condition_metrics"]
  [processors.converter.fields]
    integer = ["shift_start_epoch", "shift_number"]
    boolean = ["alarm_active", "is_running", "is_faulted", "is_idle", "is_changeover",
                "prefault_active"]

# ------------------------------------------------------------------------------
# PROCESSOR 3 — Deduplicate static reference fields that never change
#   Prevents writing identical rated_throughput_kgh / ideal_cycle_time_s / rated_kw
#   on every interval — reduces write amplification for constant-value fields
#   [TOML-06 FIXED]
# ------------------------------------------------------------------------------
[[processors.dedup]]
  namepass      = ["production_metrics", "energy_metrics"]
  dedup_interval = "300s"   # suppress re-writes of unchanged values for 5 min

# ==============================================================================
# INPUT: MACHINE TELEMETRY
# Measurement: machine_telemetry
#
# Tags (indexed, low-cardinality):
#   tenant, plant, machine, type, sensor_id
#   line_id           — injected by processors.override above
#   machine_status    — RUNNING | IDLE | FAULT | CHANGEOVER
#   alarm_code        — ALM-xxx code string, "NONE" when healthy
#   shift_name        — Morning | Afternoon | Night
#
# Fields (measurements and numeric states):
#   rpm, temp, vib, speed_ratio           — sensor readings
#   alarm_active                          — boolean (converted by processor)
#   is_running, is_faulted, is_idle,      — boolean flags for Flux arithmetic
#   is_changeover                           e.g. mean(is_faulted) = fault_rate
#   shift_number                          — integer (1|2|3)
#   shift_start_epoch                     — integer Unix seconds
#
# Units (NOT stored as tags — document in schema registry):
#   rpm → rpm | temp → °C | vib → mm/s | speed_ratio → dimensionless
# ==============================================================================
[[inputs.mqtt_consumer]]
  servers          = ["tcp://mosquitto:1883"]
  topics           = ["factory/+/+/telemetry"]
  name_override    = "machine_telemetry"
  data_format      = "json_v2"
  qos              = 1                          # [TOML-05 FIXED] at-least-once delivery
  client_id        = "telegraf-telemetry-01"    # [TOML-05 FIXED] stable session ID
  persistent_session = true                     # [TOML-05 FIXED] retain subscriptions on reconnect
  tagexclude       = ["topic"]

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = [
        "tenant", "plant", "machine", "type", "sensor_id",
        # line_id injected by processors.override — not in payload
        "machine_status",
        "alarm_code",
        "shift_name"
        # shift_number and shift_start_epoch go to fields (numeric, not string tags)
        # REMOVED: seq_id (redundant with sensor_id) [BUG-12]
        # REMOVED: rpm_unit, temp_unit, vib_unit (constant strings) [TOML-01]
      ]
      included_keys = [
        "rpm", "temp", "vib", "speed_ratio",
        "alarm_active",
        "is_running", "is_faulted", "is_idle", "is_changeover",
        "shift_number", "shift_start_epoch"
      ]

# ==============================================================================
# INPUT: PRODUCTION METRICS
# Measurement: production_metrics
#
# Tags:
#   tenant, plant, machine, sensor_id
#   machine_status, shift_name, line_id (injected)
#
# Fields:
#   in_kg, out_kg                               — mass processed this interval (kg)
#   yield_target, yield_actual                  — % (target from blueprint, actual from flow)
#   ideal_cycle_time_s, actual_cycle_time_s     — null during non-productive states
#   rated_throughput_kgh, actual_throughput_kgh — kg/h (actual ≤ rated always)
#   oee, oee_availability, oee_performance,     — % (ISO 22400-2 compliant)
#   oee_quality
#   changeover_loss_pct                         — % planned loss during CHANGEOVER
#   downtime_min                                — unplanned downtime minutes this interval
#   shift_number (int), shift_start_epoch (int)
#
# Units: kg | s | kg/h | % — documented here, NOT stored in InfluxDB [TOML-01]
# ==============================================================================
[[inputs.mqtt_consumer]]
  servers          = ["tcp://mosquitto:1883"]
  topics           = ["factory/+/+/production"]
  name_override    = "production_metrics"
  data_format      = "json_v2"
  qos              = 1
  client_id        = "telegraf-production-01"
  persistent_session = true
  tagexclude       = ["topic"]

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = [
        "tenant", "plant", "machine", "sensor_id",
        "machine_status",
        "shift_name"
        # REMOVED: weight_unit, cycle_time_unit, oee_unit [TOML-01]
        # REMOVED: seq_id [BUG-12]
      ]
      included_keys = [
        "in_kg", "out_kg",
        "yield_target", "yield_actual",
        "ideal_cycle_time_s", "actual_cycle_time_s",
        "rated_throughput_kgh", "actual_throughput_kgh",
        "oee", "oee_availability", "oee_performance", "oee_quality",
        "changeover_loss_pct",
        "downtime_min",
        "shift_number", "shift_start_epoch"
      ]

# ==============================================================================
# INPUT: ENERGY METRICS
# Measurement: energy_metrics
#
# Tags:
#   tenant, plant, machine, sensor_id
#   machine_status, shift_name, line_id (injected)
#
# Fields:
#   kwh           — cumulative meter reading (monotonically increasing) [kWh]
#   kw            — instantaneous demand [kW]
#   kwh_delta     — energy consumed this interval [kWh] — SUM this for totals
#   kwh_per_kg    — shift-cumulative energy intensity [kWh/kg] (ISO 50001)
#                   null when no production this interval
#   power_factor  — 0.80–0.95 running, 0.95–1.0 standby
#   rated_kw      — nameplate kW for this machine (for load_factor = kw/rated_kw)
#   shift_number (int), shift_start_epoch (int)
#
# Key Flux patterns:
#   Interval energy total  : sum(kwh_delta) — no derivative() needed
#   Load factor            : mean(kw) / mean(rated_kw)
#   Shift energy intensity : last(kwh_per_kg) — cumulative, use last value
# ==============================================================================
[[inputs.mqtt_consumer]]
  servers          = ["tcp://mosquitto:1883"]
  topics           = ["factory/+/+/energy"]
  name_override    = "energy_metrics"
  data_format      = "json_v2"
  qos              = 1
  client_id        = "telegraf-energy-01"
  persistent_session = true
  tagexclude       = ["topic"]

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = [
        "tenant", "plant", "machine", "sensor_id",
        "machine_status",
        "shift_name"
        # REMOVED: kwh_unit, kw_unit, kwh_per_kg_unit [TOML-01]
        # REMOVED: seq_id [BUG-12]
      ]
      included_keys = [
        "kwh", "kw", "kwh_delta",
        "kwh_per_kg", "power_factor",
        "rated_kw",
        "shift_number", "shift_start_epoch"
      ]

# ==============================================================================
# INPUT: CONDITION METRICS
# Measurement: condition_metrics
#
# Tags:
#   tenant, plant, machine, sensor_id
#   machine_status, shift_name, line_id (injected)
#
# Fields:
#   brg_temp          — bearing temperature [°C] (exponential cooling in FAULT/IDLE)
#   lub_lvl           — lubrication level [%] (stateful drain; refill at < 65%)
#   downtime_min      — non-productive minutes this interval
#   brg_health_score  — 0–100 (100=perfect; FAULT=5–20; IDLE recovers gradually)
#   prefault_active   — boolean: true during leading-indicator window before fault
#                       Use this as the label for AI anomaly detection training
#   shift_number (int), shift_start_epoch (int)
#
# Units: °C | % | min | dimensionless — documented here [TOML-01]
#
# AI Agent note:
#   prefault_active=true labels the 15–40 intervals BEFORE a FAULT event.
#   These records show rising brg_temp, rising vib, falling lub_lvl, falling
#   brg_health_score — the causal chain an AI should learn to detect.
# ==============================================================================
[[inputs.mqtt_consumer]]
  servers          = ["tcp://mosquitto:1883"]
  topics           = ["factory/+/+/condition"]
  name_override    = "condition_metrics"
  data_format      = "json_v2"
  qos              = 1
  client_id        = "telegraf-condition-01"
  persistent_session = true
  tagexclude       = ["topic"]

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = [
        "tenant", "plant", "machine", "sensor_id",
        "machine_status",
        "shift_name"
        # REMOVED: brg_temp_unit, lub_unit, downtime_unit [TOML-01]
        # REMOVED: seq_id [BUG-12]
      ]
      included_keys = [
        "brg_temp", "lub_lvl",
        "downtime_min", "brg_health_score",
        "prefault_active",
        "shift_number", "shift_start_epoch"
      ]

# ==============================================================================
# FREQUENCY & INTERVAL RATIONALE
# ==============================================================================
#
# RECOMMENDED SETTINGS:
#   Node-RED Inject node  →  Repeat: interval = 60 seconds
#   telegraf [agent]      →  interval = "60s", flush_interval = "60s"
#   InfluxDB 3 Cloud      →  no special config needed (accepts any rate)
#
# WHY 60 SECONDS (not 30s or 10s):
#
#   1. DATA VOLUME:
#      14 machines × 4 measurements × 1 write/min = 56 MQTT publishes/min
#      = 56 × 60 min × 24 h = 80,640 data points/day per plant
#      At 30s → 161,280/day. At 10s → 483,840/day.
#      60s provides rich training data without hitting InfluxDB Cloud free tier limits.
#
#   2. PROCESS PHYSICS:
#      Manufacturing processes change on timescales of minutes, not seconds.
#      OEE, throughput, bearing health — meaningful at 60s resolution.
#      The only exception is vibration (benefits from 1–10s), but for a
#      synthetic training dataset, 60s captures all relevant dynamics.
#
#   3. STATE MACHINE ALIGNMENT:
#      The v3.0 state engine uses minimum dwell times of 3–8 intervals.
#      At 60s:  FAULT min dwell = 8 min  → realistic MTTR
#      At 30s:  FAULT min dwell = 4 min  → too short
#      At 120s: FAULT min dwell = 16 min → too long for minor faults
#
#   4. TELEGRAF PIPELINE SMOOTHNESS:
#      interval=flush_interval=60s ensures each collection cycle
#      completes before the next flush, no buffer accumulation.
#      collection_jitter=2s + flush_jitter=5s prevents exact-second
#      write bursts to InfluxDB (thundering herd prevention).
#
#   5. AI AGENT TRAINING DATA:
#      Pre-fault window: 15–40 intervals = 15–40 min of leading indicators.
#      At 60s resolution, this gives the AI 15–40 labelled training samples
#      per fault event — sufficient for LSTM/Transformer sequence models.
#
# IF YOU WANT HIGHER RESOLUTION LATER:
#   - For vibration/RPM: add a 10s inject node publishing ONLY telemetry topic
#     with a separate Telegraf input block writing to a separate measurement
#     (machine_telemetry_hf). Keep production/energy/condition at 60s.
#   - Do NOT run all 4 measurements at 10s unless you have InfluxDB usage
#     headroom — it generates 672 writes/min across 14 machines.
#
# SCHEMA UNITS REFERENCE (not stored in DB — document here):
#   rpm               : rpm (revolutions per minute)
#   temp, brg_temp    : °C (degrees Celsius)
#   vib               : mm/s (RMS velocity, ISO 10816 standard)
#   in_kg, out_kg     : kg (mass per interval)
#   rated/actual_throughput_kgh : kg/h (mass flow rate)
#   ideal/actual_cycle_time_s   : s (seconds per kg)
#   oee, oee_*, yield_*         : % (0–100)
#   kwh, kwh_delta    : kWh (kilowatt-hours)
#   kw, rated_kw      : kW (kilowatts)
#   kwh_per_kg        : kWh/kg (energy intensity)
#   power_factor      : dimensionless (0–1)
#   lub_lvl           : % (0–100)
#   brg_health_score  : dimensionless (0–100)
#   downtime_min      : minutes
#   shift_start_epoch : Unix seconds (integer)
#   speed_ratio       : dimensionless (0–1)
#   changeover_loss_pct : %
# ==============================================================================
