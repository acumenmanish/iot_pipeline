[agent]
  interval = "60s"
  ## Batch size for every write.
  ## Increase this for high volume, but too high can cause timeouts.
  metric_batch_size = 5000

  ## The "Safety Net". If InfluxDB is slow, Telegraf stores metrics here.
  ## Should be at least 5-10x your batch size.
  metric_buffer_limit = 50000

  ## Helps prevent all your Telegraf instances from hitting InfluxDB at the exact same millisecond.
  flush_jitter = "2s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  #  the 6-segment topic from Node-RED
  topics = ["+/+/+/+/+/+/factory_telemetry"]

  data_format = "json_v2"
 #"factory/telemetry/tenant_beta/all_machines"
 #mineral/tenant_alpha/Division_1/pcc_mumbai_01/Shop floor 1/Crusher/factory_telemetry
  # --- TOPIC MAPPING (The Identity) ---
  [[inputs.mqtt_consumer.topic_parsing]]

    topic = "+/+/+/+/+/+/+"
    measurement = "_/_/_/_/_/_/measurement" # factory_telemetry
    tags = "domain/tenant/division/plant/area/machine/"

  [[inputs.mqtt_consumer.json_v2]]
    # --- TAGS (Used for Filtering, Security, and Grouping) ---
    # We make these tags so you can instantly filter by "Division 1" or "Manager 1"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "metadata.division.value"
      rename = "division"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "metadata.manager.value"
      rename = "manager"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "metadata.shop_floor.value"
      rename = "shop_floor"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "metadata.sensor_id.value"
      rename = "sensor_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "hr.shift.value"
      rename = "shift"

    # --- FIELDS (Used for Math, Aggregation, and Gauges) ---

    # Telemetry
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "telemetry.vibration.value"
      rename = "vibration"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "telemetry.pressure.value"
      rename = "pressure"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "telemetry.temperature.value"
      rename = "temperature"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "telemetry.status.value"
      rename = "status"
      type = "string"

    # Production (Matches Page 3 of your PDF)
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "production.output.value"
      rename = "output_tonnes"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "production.planned_output.value"
      rename = "planned_output"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "production.throughput_pct.value"
      rename = "throughput_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "production.cycle_time_adherence.value"
      rename = "cycle_time_adherence"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "production.first_pass_yield.value"
      rename = "quality_fpy"
      type = "float"

    # Energy Data
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "energy.consumption.value"
      rename = "energy_consumption"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "energy.voltage.value"
      rename = "energy_voltage"
      type = "float"

    # Equipment Performance
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "equipment_performance.mttr.value"
      rename = "mttr_hrs"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "equipment_performance.mtbf.value"
      rename = "mtbf_hrs"
      type = "int"

    # HR Data
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hr.attendance.value"
      rename = "staff_attendance_count"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hr.attendance.target"
      rename = "staff_attendance_target"
      type = "int"

    # Use the timestamp from the payload
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "timestamp"
      type = "string"

# --- OUTPUT ROUTING ---
[[outputs.influxdb_v2]]
  urls = ["https://us-east-1-1.aws.cloud2.influxdata.com"]
  token = "${INFLUX_TOKEN1}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET1}"

  ## The most important fix for "Context Deadline Exceeded"
  timeout = "30s"

  ## Optional: Use gzip compression to reduce bandwidth usage
  content_encoding = "gzip"

  [outputs.influxdb_v2.tagpass]
    tenant = ["tenant_alpha"]


[[outputs.influxdb_v2]]
  urls = ["https://us-east-1-1.aws.cloud2.influxdata.com"]
  token = "${INFLUX_TOKEN2}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET2}"

    ## The most important fix for "Context Deadline Exceeded"
  timeout = "30s"

  ## Optional: Use gzip compression to reduce bandwidth usage
  content_encoding = "gzip"

  [outputs.influxdb_v2.tagpass]
    tenant = ["tenant_beta"]


